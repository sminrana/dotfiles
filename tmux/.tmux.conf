# ==============================================================================
# Smin Rana - Tmux Configuration
# Harmonized with WezTerm & Neovim / LazyVim
# ==============================================================================

# Prefix key: Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ==============================================================================
# Window & Pane Management
# ==============================================================================
# Base indexes start at 1 (matches keyboard 1..9)
set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# Intuitive splits (keep current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Kill pane shortcuts
unbind x
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
# Prefix + X: instant kill without prompt
bind X if-shell '[ "$(tmux list-panes | wc -l)" -gt 1 ]' 'kill-pane' 'kill-window'

# Pane zooming (focus toggle)
bind z resize-pane -Z

# Pane resizing with repeatable keys
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Window navigation
unbind p
bind p previous-window
bind n next-window

# ==============================================================================
# Neovim & Terminal Display Fidelity (Truecolor & Undercurls)
# ==============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"

# Undercurl support for LazyVim diagnostics (wavy lines)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Colored underline support for LazyVim diagnostics
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Fast escape time (critical for vim/nvim mode switching)
set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ==============================================================================
# Clipboard & Mouse
# ==============================================================================
set -g mouse on
setw -g mode-keys vi
set -s set-clipboard on

# Copy-mode vi keybindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -n Home send Escape "OH"
bind -n End send Escape "OF"

# Copy mode pane navigation
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ==============================================================================
# Seamless Vim-Tmux Navigation (vim-tmux-navigator integration)
# ==============================================================================
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# ==============================================================================
# Popups & Workflows
# ==============================================================================
# Prefix + r: Reload configuration
bind r source-file ~/.tmux.conf \; display "Tmux configuration reloaded!"

# Prefix + g: Fuzzy project sessionizer (in floating popup)
bind g display-popup -E -w 75% -h 65% "${HOME}/.config/tmux/scripts/sessionizer"

# Prefix + N: Quick session creator / switcher popup
bind N display-popup -w 60% -h 20% -E "sh -c 'printf \"Session name: \"; IFS= read -r name; [ -z \"\$name\" ] && exit 0; tmux has-session -t \"\$name\" 2>/dev/null || tmux new-session -d -s \"\$name\"; tmux switch-client -t \"\$name\"'"

# Prefix + W: Window menu popup
bind W run-shell "${HOME}/.config/tmux/scripts/window-menu.sh"
# Prefix + S: Session menu popup
bind S run-shell "${HOME}/.config/tmux/scripts/session-menu.sh"

# Status & Naming
set -g history-limit 10000
set -g display-time 1500
set -g allow-rename off
setw -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}:#{b:pane_current_command}"
set -g status-interval 5

# Window format in status bar
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"

# ==============================================================================
# Plugins (TPM)
# ==============================================================================
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-open'

# Continuum & Resurrect settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# ==============================================================================
# Seamless Mouse & Clipboard Integration (macOS pbcopy)
# ==============================================================================
# Mouse drag: select and immediately pipe to macOS clipboard on release
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Double click: select word and copy to macOS clipboard
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"

# Triple click: select line and copy to macOS clipboard
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
